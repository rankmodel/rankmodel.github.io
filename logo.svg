<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="mr-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background transparent -->
  <rect width="512" height="512" fill="none" />
  
  <g filter="url(#shadow)">
    <!-- Shield / Medal Background -->
    <path d="M 256 32 C 256 32 100 80 100 80 L 100 240 C 100 360 256 480 256 480 C 256 480 412 360 412 240 L 412 80 C 412 80 256 32 256 32 Z" fill="url(#mr-gradient)" />
    
    <!-- Bar chart motif / MR Monogram -->
    <!-- M Left Leg -->
    <rect x="160" y="180" width="36" height="150" rx="8" fill="#ffffff" />
    <!-- M Center Left -->
    <rect x="210" y="210" width="36" height="120" rx="8" fill="#ffffff" />
    <!-- M Center Right / R Stem -->
    <rect x="260" y="160" width="36" height="170" rx="8" fill="#ffffff" />
    <!-- R Right Leg -->
    <rect x="310" y="240" width="36" height="90" rx="8" fill="#ffffff" />
    <!-- R Loop -->
    <path d="M 296 160 H 316 C 344 160 360 176 360 200 C 360 224 344 240 316 240 H 296 V 160 Z" fill="none" stroke="#ffffff" stroke-width="28" stroke-linejoin="round" />
  </g>
</svg>
