name: 🏆 Daily Leaderboard Update

on:
  schedule:
    - cron: '0 2 * * *'   # 2am UTC = 7:30am IST, every day
  workflow_dispatch:        # allow manual trigger from GitHub UI
    inputs:
      limit:
        description: 'Number of models to seed'
        required: false
        default: '50'

permissions:
  contents: write           # needed to commit badge files back

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  CACHE_DB_PATH: data/modelrank.db

jobs:
  update-leaderboard:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore leaderboard DB from cache
        uses: actions/cache@v4
        with:
          path: data/modelrank.db
          key: modelrank-db-${{ github.run_id }}
          restore-keys: |
            modelrank-db-

      - name: Seed leaderboard (text-generation, top models)
        run: |
          python scripts/seed_leaderboard.py \
            --task text-generation \
            --limit ${{ github.event.inputs.limit || '50' }} \
            --sort downloads \
            --delay 0.5

      - name: Generate static badges & leaderboard JSON
        run: python scripts/generate_static_assets.py

      - name: Generate weekly newsletter page
        run: python scripts/generate_weekly.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./static_output
          publish_branch: gh-pages
          commit_message: '🤖 Auto-update leaderboard & badges [${{ github.run_number }}]'

      - name: Upload DB artifact (for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: modelrank-db-${{ github.run_number }}
          path: data/modelrank.db
          retention-days: 7
