name: 🚀 Daily Model Refresh

# Incrementally ranks ~500 NEW HuggingFace models per day and keeps the
# leaderboard capped at 2000 (oldest removed via FIFO). See
# scripts/daily_refresh.py for the ranking/trim logic.
on:
  schedule:
    - cron: '0 3 * * *'   # 3am UTC = 8:30am IST, every day
  workflow_dispatch:
    inputs:
      daily:
        description: 'New models to rank this run'
        required: false
        default: '500'
      cap:
        description: 'Hard cap on total models kept'
        required: false
        default: '2000'
      fetch_limit:
        description: 'Newest models pulled per sort pass'
        required: false
        default: '1500'
  push:
    branches: [main]

permissions:
  contents: write

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  CACHE_DB_PATH: data/modelrank.db

jobs:
  refresh-leaderboard:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore leaderboard DB from cache (carries the 2000-cap across days)
        uses: actions/cache@v4
        with:
          path: data/modelrank.db
          key: modelrank-db-${{ github.run_id }}
          restore-keys: |
            modelrank-db-

      - name: Rank 500 new models from HuggingFace (cap 2000)
        if: github.event_name != 'push'
        run: |
          python scripts/daily_refresh.py \
            --task text-generation \
            --daily ${{ github.event.inputs.daily || '500' }} \
            --cap ${{ github.event.inputs.cap || '2000' }} \
            --fetch-limit ${{ github.event.inputs.fetch_limit || '1500' }} \
            --sort createdAt \
            --backup-sort lastModified \
            --delay 0.1

      - name: Generate static badges & leaderboard JSON
        run: python scripts/generate_static_assets.py

      - name: Generate weekly newsletter page
        run: python scripts/generate_weekly.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build React + Three.js frontend (ThreeUI)
        working-directory: web
        run: |
          # emptyOutDir is false (to preserve leaderboard.json/badges), so
          # drop previously-built JS/CSS chunks to avoid stale-asset pile-up.
          rm -rf ../static_output/assets
          npm ci
          node node_modules/esbuild/install.js
          npm run build

      - name: Remove stale static HTML pages (replaced by React app)
        run: |
          rm -f static_output/collections.html static_output/pricing.html \
                static_output/methodology.html static_output/api.html \
                static_output/quiz.html static_output/head-to-head.html \
                static_output/dna.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./static_output
          publish_branch: gh-pages
          commit_message: '🤖 Auto-refresh leaderboard & badges [${{ github.run_number }}]'

      - name: Upload DB artifact (for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: modelrank-db-${{ github.run_number }}
          path: data/modelrank.db
          retention-days: 7
