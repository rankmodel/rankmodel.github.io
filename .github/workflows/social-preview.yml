# ModelRank — Auto-Generate Social Preview on Push to Main
# Regenerates brand/social_preview.png and commits it back.

name: Refresh Social Preview

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate_social_preview.py"
      - "config/settings.py"
      - "data/modelrank.db"
  schedule:
    # Re-generate weekly (picks up new top-ranked models for the ticker)
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install pillow requests

      - name: Generate social preview
        run: |
          python scripts/generate_social_preview.py --output brand/social_preview.png
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      # We no longer commit back to `main` (it caused non-fast-forward pushes).
      # The live OG image (assets/social-preview.png) is refreshed by the
      # daily-leaderboard workflow, which copies it into the published site.
      - name: Skip commit (no push to main)
        run: echo "Social preview regenerated locally; live image is updated by daily-leaderboard.yml"
